<!doctype html>
<!-- (c) 1080x1920 composite over a NASA clip (assets/footage/PROVENANCE.md) with
     word-timed karaoke captions, one page per phrase. See ../../SPEC.md. -->
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Geist";
        src: url("assets/fonts/Geist-VF.ttf") format("truetype");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "Geist Mono";
        src: url("assets/fonts/GeistMono-VF.ttf") format("truetype");
        font-weight: 100 900;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #vwrap { position: absolute; inset: 0; }
      #clip { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      #shade { position: absolute; left: 0; top: 1100px; width: 1080px; height: 820px; background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,0.8)); }
      #label { position: absolute; left: 0; top: 140px; width: 1080px; text-align: center; font: 500 30px "Geist Mono"; letter-spacing: 4px; color: rgba(255,255,255,0.85); line-height: normal; }
      .page { position: absolute; left: 100px; width: 880px; top: 1450px; transform: translateY(-50%); text-align: center; font: 800 72px/1.18 "Geist"; color: #fff; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1080" data-height="1920">
      <div id="vwrap">
        <video id="clip" class="clip" src="assets/footage/orion_moon_fd20.mp4" muted playsinline
               data-start="0" data-duration="10" data-media-start="0" data-track-index="0"></video>
      </div>
      <div id="shade"></div>
      <div id="label">NASA · ARTEMIS I · FLIGHT DAY 20</div>
      <div id="captions">
        <div class="page clip" data-start="0.4" data-duration="2.4" data-track-index="1"><span data-word="0.4 0.7">Day</span> <span data-word="0.7 1.1">twenty</span> <span data-word="1.1 1.3">of</span> <span data-word="1.3 1.9">Artemis</span> <span data-word="1.9 2.8">I.</span></div>
        <div class="page clip" data-start="2.8" data-duration="2.6" data-track-index="1"><span data-word="2.8 3.3">Orion</span> <span data-word="3.3 3.75">closes</span> <span data-word="3.75 3.95">in</span> <span data-word="3.95 4.15">on</span> <span data-word="4.15 4.35">the</span> <span data-word="4.35 5.4">Moon</span></div>
        <div class="page clip" data-start="5.4" data-duration="2.5" data-track-index="1"><span data-word="5.4 5.75">ahead</span> <span data-word="5.75 5.9">of</span> <span data-word="5.9 6.1">its</span> <span data-word="6.1 6.55">return</span> <span data-word="6.55 7.05">flyby</span> <span data-word="7.05 7.9">burn.</span></div>
        <div class="page clip" data-start="7.9" data-duration="2.1" data-track-index="1"><span data-word="7.9 8.6">Splashdown</span> <span data-word="8.6 8.8">is</span> <span data-word="8.8 9.3">December</span> <span data-word="9.3 10">11.</span></div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#vwrap", { scale: 1 }, { scale: 1.08, duration: 10, ease: "none" }, 0);
      tl.fromTo("#label", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.2);
      // karaoke: each word is lit from its start to its end (data-word="start end")
      for (const span of document.querySelectorAll("[data-word]")) {
        const [a, b] = span.dataset.word.split(" ").map(Number);
        tl.set(span, { color: "#ffd23f" }, a);
        tl.set(span, { color: "#ffffff" }, b);
      }
      tl.set({}, {}, 10);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
