<!doctype html>
<!-- (d) 1920x1080 "GPU looks": blurred colour fields, a glowing title, a fast
     motion-blurred whip, film grain and a vignette, done the HyperFrames way:
     CSS filter: blur(), text-shadow, the root's data-motion-blur, and the
     registry's grain-overlay block (`npx hyperframes add grain-overlay`). See ../../SPEC.md. -->
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Geist";
        src: url("assets/fonts/Geist-VF.ttf") format("truetype");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "Geist Mono";
        src: url("assets/fonts/GeistMono-VF.ttf") format("truetype");
        font-weight: 100 900;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #07060d; }
      .blob { position: absolute; width: 560px; height: 560px; border-radius: 50%; filter: blur(80px); }
      #b0 { left: 320px; top: 140px; background: #7c3aed; }
      #b1 { left: 1060px; top: 100px; background: #06b6d4; }
      #b2 { left: 620px; top: 520px; background: #f43f5e; }
      #title { position: absolute; left: 0; width: 1920px; top: 540px; text-align: center; font: 900 260px "Geist"; line-height: normal; color: #fff; text-shadow: 0 0 48px rgba(255,255,255,0.9); }
      #subtitle { position: absolute; left: 0; width: 1920px; top: 720px; text-align: center; font: 500 32px "Geist Mono"; letter-spacing: 8px; color: #c4b5fd; line-height: normal; }
      .whip { position: absolute; left: -180px; top: 846px; width: 360px; height: 28px; border-radius: 14px; background: #fff; }
      #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,0.69) 100%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080"
         data-motion-blur="on" data-motion-blur-shutter="180">
      <div id="b0" class="blob"></div>
      <div id="b1" class="blob"></div>
      <div id="b2" class="blob"></div>
      <div id="title">GLOW</div>
      <div id="subtitle">GPU EFFECTS TEST</div>
      <div id="whip0" class="whip clip" data-start="1" data-duration="0.6" data-track-index="1"></div>
      <div id="whip1" class="whip clip" data-start="6" data-duration="0.6" data-track-index="1"></div>
      <div id="vignette"></div>

      <!-- grain-overlay, from the HyperFrames registry (Apache-2.0), as installed -->
      <div id="grain-overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; overflow: hidden">
        <div class="grain-texture"></div>
      </div>
      <style>
        @keyframes hf-grain-noise {
          0%, 100% { transform: translate(0, 0); }
          10% { transform: translate(-5%, -5%); }
          20% { transform: translate(-10%, 5%); }
          30% { transform: translate(5%, -10%); }
          40% { transform: translate(-5%, 15%); }
          50% { transform: translate(-10%, 5%); }
          60% { transform: translate(15%, 0); }
          70% { transform: translate(0, 10%); }
          80% { transform: translate(-15%, 0); }
          90% { transform: translate(10%, 5%); }
        }
        #grain-overlay .grain-texture {
          position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
          background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
          opacity: 0.15;
          animation: hf-grain-noise 0.5s steps(1) infinite;
        }
      </style>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const E = "power2.out";
      // each colour field drifts out and back on a 10 s sine-eased loop (centres as in SPEC.md)
      const drift = [["#b0", 400, 220], ["#b1", -360, 180], ["#b2", -180, -280]];
      for (const [id, dx, dy] of drift) {
        tl.fromTo(id, { x: 0, y: 0 }, { x: dx, y: dy, duration: 5, ease: "sine.inOut" }, 0);
        tl.to(id, { x: 0, y: 0, duration: 5, ease: "sine.inOut" }, 5);
      }
      tl.fromTo("#title", { opacity: 0, yPercent: -50, scale: 0.9 }, { opacity: 1, yPercent: -50, scale: 1, duration: 1, ease: E }, 0.5);
      tl.fromTo("#subtitle", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: E }, 1.2);
      tl.fromTo("#whip0", { x: -300 }, { x: 2220, duration: 0.6, ease: "power2.inOut" }, 1.0);
      tl.fromTo("#whip1", { x: 2220 }, { x: -300, duration: 0.6, ease: "power2.inOut" }, 6.0);
      tl.set({}, {}, 10);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
